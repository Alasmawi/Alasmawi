<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Abdulla Alasmawi — Full-Stack Developer, Cloud and DevOps, Bahrain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b10"/>
      <stop offset="55%" stop-color="#0b1219"/>
      <stop offset="100%" stop-color="#0a1a1e"/>
    </linearGradient>


    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#818cf8"/>
      <animate attributeName="x1" values="0;0.5;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.5;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>


    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>


    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>


    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>


    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="320" rx="18"/>
    </clipPath>


    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>


  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="140" cy="60" rx="420" ry="260" fill="url(#glowL)"/>
    <ellipse cx="1080" cy="300" rx="420" ry="260" fill="url(#glowR)"/>


    <!-- scanline sweep -->
    <rect x="-300" y="0" width="300" height="320" fill="url(#fade)" opacity="0.10">
      <animate attributeName="x" values="-300;1200" dur="7s" repeatCount="indefinite"/>
    </rect>


    <!-- terminal chrome -->
    <circle cx="44" cy="40" r="6" fill="#ff5f57"/>
    <circle cx="66" cy="40" r="6" fill="#febc2e"/>
    <circle cx="88" cy="40" r="6" fill="#28c840"/>
    <text class="mono" x="112" y="45" font-size="13" fill="#4b5f6d">~/alasmawi — zsh</text>


    <line x1="0" y1="66" x2="1200" y2="66" stroke="#1b2a35" stroke-width="1"/>


    <!-- prompt -->
    <text class="mono" x="44" y="120" font-size="16">
      <tspan fill="#5eead4">➜</tspan>
      <tspan fill="#64748b" dx="10">~</tspan>
      <tspan fill="#22d3ee" dx="10">whoami</tspan>
    </text>


    <!-- name -->
    <text class="sans" x="44" y="186" font-size="54" font-weight="700" fill="url(#accent)" letter-spacing="-1">Abdulla Alasmawi</text>
    <text class="sans" x="44" y="186" font-size="54" font-weight="700" fill="#22d3ee" opacity="0.18" letter-spacing="-1">
      Abdulla Alasmawi
      <animate attributeName="opacity" values="0.18;0.04;0.18" dur="4s" repeatCount="indefinite"/>
    </text>


    <!-- role line -->
    <text class="mono" x="44" y="226" font-size="19" fill="#cbd5e1">
      Full-Stack Developer
      <tspan fill="#334155" dx="12">|</tspan>
      <tspan fill="#5eead4" dx="12">Cloud &amp; DevOps</tspan>
      <tspan fill="#334155" dx="12">|</tspan>
      <tspan fill="#818cf8" dx="12">Bahrain</tspan>
    </text>


    <!-- stack line with blinking cursor -->
    <text class="mono" x="44" y="266" font-size="14" fill="#64748b">
      Go · Rust · Python · JavaScript · Docker · Kubernetes · Terraform · AWS
    </text>
    <rect x="548" y="253" width="9" height="17" fill="#5eead4">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>


    <!-- arabic signature -->
    <text class="sans" x="1156" y="270" font-size="22" fill="#1e3a44" text-anchor="end">عبدالله العسماوي</text>


    <!-- bottom accent bar -->
    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
    <rect x="0" y="0" width="1200" height="320" rx="18" fill="none" stroke="#1b2a35" stroke-width="2"/>
  </g>
</svg>

